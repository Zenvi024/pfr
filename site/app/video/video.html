<div class="vwrap" id="vidTab" hidden>
  <div class="vpick" id="vpick" role="tablist" aria-label="Choose a video"></div>
  <div class="vmain">
    <div class="vcol">
      <div class="vplayer" id="vplayer">
        <div class="vscreen">
          <video id="vvid" playsinline preload="metadata"></video>
          <button class="vbig" id="vbig" aria-label="Play">▶</button>
          <div class="vflash" id="vflash" aria-hidden="true"></div>
          <div class="verr" id="verr" hidden>This video could not be loaded. If you opened the desk as a local file, keep the <code>media</code> folder next to it.</div>
        </div>
        <div class="vbar">
          <div class="vseek">
            <input type="range" id="vseek" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <div class="vticks" id="vticks" aria-hidden="true"></div>
          </div>
          <div class="vctl">
            <button id="vback" title="Back 10 seconds (←)" aria-label="Back 10 seconds">↺ 10</button>
            <button id="vplay" class="vprimary" title="Play / pause (space)" aria-label="Play">▶</button>
            <button id="vfwd" title="Forward 10 seconds (→)" aria-label="Forward 10 seconds">10 ↻</button>
            <button id="vprev" title="Previous chapter ([)" aria-label="Previous chapter">⏮</button>
            <button id="vnext" title="Next chapter (])" aria-label="Next chapter">⏭</button>
            <span class="vtime" id="vtime">0:00 / 0:00</span>
            <span class="vsp"></span>
            <button id="vcc" aria-pressed="true" title="Captions on/off (C)">CC</button>
            <label class="vrate" title="Playback speed"><span>Speed</span>
              <select id="vrate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select>
            </label>
            <button id="vmute" title="Mute (M)" aria-label="Mute">🔊</button>
            <input type="range" id="vvol" min="0" max="1" step="0.05" value="1" aria-label="Volume">
            <button id="vfs" title="Full screen (F)" aria-label="Full screen">⛶</button>
          </div>
        </div>
      </div>
      <p class="vnow" id="vnow"></p>
      <p class="vkeys">Keyboard: <kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> 10 s · <kbd>[</kbd>/<kbd>]</kbd> chapters · <kbd>C</kbd> captions · <kbd>M</kbd> mute · <kbd>F</kbd> full screen · <kbd>&lt;</kbd>/<kbd>&gt;</kbd> speed</p>
    </div>
    <aside class="vside">
      <nav class="seg" id="vsidetabs" aria-label="Side panel">
        <button data-p="chap" aria-pressed="true">Chapters</button>
        <button data-p="tx" aria-pressed="false">Transcript</button>
      </nav>
      <ol class="vchap" id="vchap"></ol>
      <div class="vtx" id="vtx" hidden>
        <label class="vfollow"><input type="checkbox" id="vfollow" checked> Follow along</label>
        <input type="search" id="vtxq" placeholder="Search the transcript…" aria-label="Search the transcript">
        <div class="vtxlist" id="vtxlist"></div>
      </div>
    </aside>
  </div>
</div>
